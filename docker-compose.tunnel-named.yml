# Optional override: permanent public HTTPS through YOUR named Cloudflare Tunnel
# (e.g. https://ms.rajeet.in). Use INSTEAD of docker-compose.tunnel.yml.
#
#   docker compose -f docker-compose.yml -f docker-compose.vpn.yml -f docker-compose.tunnel-named.yml up -d --build
#
# Needs CLOUDFLARE_TUNNEL_TOKEN in .env (Zero Trust > Networks > Tunnels > your tunnel).
# In the tunnel's Public Hostname tab route  ms.rajeet.in  ->  HTTP  caddy:80 .
# The tunnel dials out; no inbound ports (80/443) are published or need opening, and no DNS
# record ever contains the server's IP.
services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in the private .env}
    depends_on:
      - caddy
    networks:
      - web

  caddy:
    ports: !reset []
    volumes: !override
      - ./Caddyfile.tunnel:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  ytmusic:
    environment:
      JUKES_TRUSTED_PROXY_CIDRS: ${DOCKER_WEB_SUBNET:-172.18.0.0/16}
      PUBLIC_BASE_URL: ${JUKES_PUBLIC_URL:-}

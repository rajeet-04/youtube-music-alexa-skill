# Optional override: runs Gluetun (Surfshark / India) inside this Compose project.
#
#   docker compose -f docker-compose.yml -f docker-compose.vpn.yml up -d
#
# Skip this file entirely if you already run Gluetun yourself; then just set
# VPN_CONTAINER_NAME / GLUETUN_ALIAS in .env to match your existing container.
#
# The VPN profile is NOT in git. Put your own files in ./vpn (see vpn/README.md):
#   WireGuard (default): vpn/wireguard/<VPN_PROFILE>.conf  (default in-mum)
#   OpenVPN:             vpn/openvpn/surfshark.ovpn  + OPENVPN_USER / OPENVPN_PASSWORD in .env
services:
  gluetun:
    image: qmcgaw/gluetun:v3
    container_name: ${VPN_CONTAINER_NAME:-gluetun}
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:-custom}
      VPN_TYPE: ${VPN_TYPE:-wireguard}
      # OpenVPN only (ignored for WireGuard). Surfshark "service credentials", not your login.
      OPENVPN_CUSTOM_CONFIG: ${OPENVPN_CUSTOM_CONFIG:-/gluetun/openvpn/surfshark.ovpn}
      OPENVPN_USER: ${OPENVPN_USER:-}
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD:-}
      # Native Surfshark provider alternative (set VPN_SERVICE_PROVIDER=surfshark):
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:-}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES:-}
      SERVER_COUNTRIES: ${VPN_SERVER_COUNTRIES:-India}
      # Let Caddy (on the web network) reach Flask and noVNC inside this namespace,
      # and let the app reach bgutil-provider on the same Docker network.
      FIREWALL_INPUT_PORTS: ${FIREWALL_INPUT_PORTS:-5000,6080}
      FIREWALL_OUTBOUND_SUBNETS: ${DOCKER_WEB_SUBNET:-172.18.0.0/16}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      # Only the selected profile is mounted (VPN_PROFILE in .env), as the fixed name Gluetun reads.
      - ./vpn/wireguard/${VPN_PROFILE:-in-mum}.conf:/gluetun/wireguard/wg0.conf:ro
      - ./vpn/openvpn:/gluetun/openvpn:ro
    ports:
      # Loopback-only smoke-test access to the API. Public traffic goes through
      # Caddy on 80/443; do not widen this unless you accept direct-peer IP limits.
      - "${JUKES_DIRECT_BIND:-127.0.0.1:5000}:5000"
    networks:
      web:
        aliases:
          - ${GLUETUN_ALIAS:-gluetun}
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  ytmusic:
    depends_on:
      gluetun:
        condition: service_healthy

  youtube-browser:
    depends_on:
      gluetun:
        condition: service_healthy

services:
  ytmusic:
    build: ./flask-server
    container_name: ytmusic
    restart: unless-stopped
    # Gluetun is managed outside this Compose project. Keep both app and browser
    # in the selected VPN namespace so a VPN disconnect is handled by its
    # kill-switch instead of silently falling back to direct egress.
    network_mode: "container:${VPN_CONTAINER_NAME:-gluetun}"
    env_file:
      - path: .env
        required: false
    environment:
      JUKES_DB_PATH: ${JUKES_DB_PATH:-/data/jukes.sqlite3}
      JUKES_AUDIO_DIR: ${JUKES_AUDIO_DIR:-/tmp/ytm_audio_cache}
      JUKES_REQUESTED_CACHE_LIMIT_BYTES: ${JUKES_REQUESTED_CACHE_LIMIT_BYTES:-20000000000}
      JUKES_WARMUP_CACHE_LIMIT_BYTES: ${JUKES_WARMUP_CACHE_LIMIT_BYTES:-1000000000}
      JUKES_WARMUP_TTL_SECONDS: ${JUKES_WARMUP_TTL_SECONDS:-7200}
      JUKES_WARMUP_WORKERS: ${JUKES_WARMUP_WORKERS:-1}
      JUKES_PROGRESSIVE: ${JUKES_PROGRESSIVE:-0}
      JUKES_PREPARE_OVERLAP: ${JUKES_PREPARE_OVERLAP:-0}
      JUKES_EXTRACTOR_FORKSERVER: ${JUKES_EXTRACTOR_FORKSERVER:-0}
      JUKES_MIN_FREE_DISK_BYTES: ${JUKES_MIN_FREE_DISK_BYTES:-2000000000}
      JUKES_ADMIN_PASSWORD_HASH: ${JUKES_ADMIN_PASSWORD_HASH:-}
      JUKES_ADMIN_SESSION_KEY: ${JUKES_ADMIN_SESSION_KEY:-}
      JUKES_CREDENTIAL_ENCRYPTION_KEY: ${JUKES_CREDENTIAL_ENCRYPTION_KEY:-}
      JUKES_TRUSTED_PROXY_CIDRS: ${JUKES_TRUSTED_PROXY_CIDRS:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      YT_BROWSER_SERVICE_URL: ${YT_BROWSER_SERVICE_URL:-http://127.0.0.1:8765}
      YT_BROWSER_CONTROL_TOKEN: ${YT_BROWSER_CONTROL_TOKEN:?set YT_BROWSER_CONTROL_TOKEN in private .env}
      YT_BROWSER_CAPTURE_TIMEOUT: ${YT_BROWSER_CAPTURE_TIMEOUT:-120}
      YT_BROWSER_LOGIN_TIMEOUT: ${YT_BROWSER_LOGIN_TIMEOUT:-240}
      YT_BROWSER_SUCCESS_DISPLAY: ${YT_BROWSER_SUCCESS_DISPLAY:-12}
      YT_BROWSER_SCREEN_GEOMETRY: ${YT_BROWSER_SCREEN_GEOMETRY:-1365x768x24}
      YTDLP_BGUTIL_BASE_URL: ${YTDLP_BGUTIL_BASE_URL:-http://bgutil-provider:4416}
      YTDLP_JS_RUNTIME: ${YTDLP_JS_RUNTIME:-deno}
    volumes:
      # Keep the existing app data and audio volumes attached. The new database
      # lives beside the untouched legacy /data/data.db.
      - ytmusic_data:/data
      - ytmusic_cache:/tmp/ytm_audio_cache
      # Optional legacy-cookie migration mount (temporary, read-only):
      # - ./cookies.txt:/run/secrets/legacy-ytdlp-cookies.txt:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health/live', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  youtube-browser:
    build: ./browser-auth
    container_name: youtube-browser
    restart: unless-stopped
    network_mode: "container:${VPN_CONTAINER_NAME:-gluetun}"
    environment:
      YT_BROWSER_CONTROL_TOKEN: ${YT_BROWSER_CONTROL_TOKEN:?set YT_BROWSER_CONTROL_TOKEN in private .env}
      YT_BROWSER_CAPTURE_TIMEOUT: ${YT_BROWSER_CAPTURE_TIMEOUT:-120}
      YT_BROWSER_LOGIN_TIMEOUT: ${YT_BROWSER_LOGIN_TIMEOUT:-240}
      YT_BROWSER_SUCCESS_DISPLAY: ${YT_BROWSER_SUCCESS_DISPLAY:-12}
      SCREEN_GEOMETRY: ${YT_BROWSER_SCREEN_GEOMETRY:-1365x768x24}
    volumes:
      - ytmusic_chromium_profile:/profile
    shm_size: 512mb

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      GLUETUN_ALIAS: ${GLUETUN_ALIAS:-gluetun}
      CADDY_TRUSTED_PROXY_CONFIG: ${CADDY_TRUSTED_PROXY_CONFIG:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

networks:
  web:
    external: true
    name: web

volumes:
  ytmusic_cache:
  ytmusic_data:
  ytmusic_chromium_profile:
  caddy_data:
  caddy_config:

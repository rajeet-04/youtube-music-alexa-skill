# Azure: no VPN. A stand-in "gluetun" holds the shared network namespace so the existing
# network_mode wiring (ytmusic, youtube-browser, ytresolver, bgutil) keeps working.
services:
  gluetun:
    image: alpine:3
    container_name: gluetun
    restart: unless-stopped
    command: ["sleep", "infinity"]
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      web:
        aliases: [gluetun]
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on: [gluetun]
  ytmusic:
    network_mode: "service:gluetun"
    environment:
      YTDLP_BGUTIL_BASE_URL: http://127.0.0.1:4416
    depends_on: [gluetun, bgutil-provider]
  youtube-browser:
    network_mode: "service:gluetun"
    depends_on: [gluetun]
